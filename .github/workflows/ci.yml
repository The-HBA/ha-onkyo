name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.14 && uv pip install -r requirements_test_ha.txt
      - run: .venv/bin/ruff format --check .
      - run: .venv/bin/ruff check .
      - run: .venv/bin/mypy

  library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # The package __init__ imports Home Assistant, so the tests need it installed; the plugin stays off.
      - run: uv venv --python 3.14 && uv pip install -r requirements_test_ha.txt
      - run: .venv/bin/pytest -q -p no:homeassistant tests/lib tests/tools tests/test_boundary.py --cov=custom_components/onkyo_eiscp/lib

  home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.14 && uv pip install -r requirements_test_ha.txt
      - run: .venv/bin/pytest -q tests/ha --cov=custom_components/onkyo_eiscp

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
