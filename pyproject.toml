[project]
name = "ha-onkyo"
version = "0.0.1"
description = "Home Assistant integration and tools for Onkyo, Pioneer and Integra network receivers (eISCP)."
requires-python = ">=3.14"
license = "MIT"
readme = "README.md"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # conflicts with the formatter
    "D203",    # conflicts with D211
    "D213",    # conflicts with D212
    "CPY001",  # no copyright header in files
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "TC001", "TC002", "TC003", "S101", "PLR2004", "INP001", "D", "ANN401", "SLF001"]
"tools/**" = ["E402", "ASYNC109", "PLW2901", "ARG001", "INP001", "T201", "D", "PLR0913", "C901", "PLR0912", "PLR0915", "BLE001", "S311"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["custom_components/onkyo_eiscp/lib", "tools"]
explicit_package_bases = true
mypy_path = "."

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
